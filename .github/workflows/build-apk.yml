name: بناء APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: قراءة رقم الإصدار
        id: ver
        run: |
          V=$(sed -n 's/.*versionName "\(.*\)"/\1/p' app/build.gradle | head -1)
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: بناء APK
        run: gradle assembleDebug --no-daemon

      - name: نشر الإصدار
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "القرآن الكريم v${{ steps.ver.outputs.v }} — أحدث نسخة"
          body: "آخر بناء من ${{ github.sha }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
