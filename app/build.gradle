plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aya.quran'
    compileSdk 34

    defaultConfig {
        applicationId "com.aya.quran"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            // signed with the standard debug key — installs directly on a phone
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
